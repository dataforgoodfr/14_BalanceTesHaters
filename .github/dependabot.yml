version: 2
updates:
  - package-ecosystem: npm
    directory: /browser-extension
    schedule:
      interval: weekly
    labels:
      - dependencies
    cooldown:
      default-days: 5
    groups:
      browser-extension-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions    
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    cooldown:
      default-days: 5
    groups:
      github-actions-minor-patch:
        update-types:
          - minor
          - patch

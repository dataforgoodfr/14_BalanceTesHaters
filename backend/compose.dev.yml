# Docker compose pour le développement local.
# Identifiants de test et ports exposés sur localhost.
# Ne pas utiliser pour un déploiement.

services:
  db:
    image: postgres:18.1-alpine3.23
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_DB=bth
      - POSTGRES_USER=bth
      - POSTGRES_PASSWORD=bth
    volumes:
      - pgdata:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bth -d bth"]
      interval: 2s
      timeout: 2s
      retries: 30

  api:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    working_dir: /workspace/backend
    volumes:
      # Mount source and runtime configuration without the host virtualenv.
      # The container uses /app/.venv from the image.
      - ./balanceteshaters:/workspace/backend/balanceteshaters:ro
      - ./alembic:/workspace/backend/alembic:ro
      - ./server.py:/workspace/backend/server.py:ro
      - ./alembic.ini:/workspace/backend/alembic.ini:ro
      - ./logging.ini:/workspace/backend/logging.ini:ro
    environment:
      BTH_ENGINE_ECHO: "0"
      # Limit native compute pools within the default four-CPU quota.
      OMP_NUM_THREADS: "3"
      MKL_NUM_THREADS: "3"
      OPENBLAS_NUM_THREADS: "1"
      BTH_LOGGING_CONFIGURATION_FILE: /workspace/backend/logging.ini
      BTH_PG_DSN: postgresql+asyncpg://bth:bth@db:5432/bth
      BTH_PRIVATE_API_TOKEN: local-development-private-token
      BTH_PUBLIC_API_TOKEN: local-development-public-token
      BTH_METRICS_USERNAME: local-development-metrics
      BTH_METRICS_PASSWORD: local-development-metrics-password
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # Match Clever Cloud ressources: 
    # * disabling swap by setting memswap_limit: combined RAM + swap equals RAM.
    # * restricting CPU and Memory
    memswap_limit: "${BTH_MEMORY_LIMIT:-3G}"
    deploy:
      resources:
        limits:
          cpus: "${BTH_CPU_LIMIT:-4.0}"
          memory: "${BTH_MEMORY_LIMIT:-3G}"
    command:
      [
        "/bin/bash",
        "-ec",
        "/app/.venv/bin/alembic upgrade head && exec /app/.venv/bin/fastapi dev server.py --host 0.0.0.0",
      ]

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=4h
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
    volumes:
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      api:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: "256M"

configs:
  prometheus_config:
    content: |
      global:
        scrape_interval: 15s

      scrape_configs:
        - job_name: bth-backend
          metrics_path: /metrics
          basic_auth:
            username: local-development-metrics
            password: local-development-metrics-password
          static_configs:
            - targets: [api:8000]

volumes:
  pgdata:
  prometheus_data:
